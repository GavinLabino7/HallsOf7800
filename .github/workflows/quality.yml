name: Quality

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run JUnit regression tests
        run: ./mvnw clean test

      - name: Run PIT mutation testing
        run: ./mvnw org.pitest:pitest-maven:mutationCoverage

      - name: Run SpotBugs
        run: ./mvnw spotbugs:spotbugs

      - name: Upload SpotBugs SARIF
        if: >-
          always() &&
          hashFiles('target/spotbugsSarif.json') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs
